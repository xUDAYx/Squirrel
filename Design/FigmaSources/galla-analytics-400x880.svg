<svg xmlns="http://www.w3.org/2000/svg" width="400" height="880" viewBox="0 0 400 880">
  <title>Screen/Analytics</title>
  <style>
    .ui { font-family: "SF Pro Display", "SF Pro", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #0A0A0D; }
    .rounded { font-family: "SF Pro Rounded", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #0A0A0D; }
    .secondary { fill: #85858F; }
    .positive { fill: #16C784; }
    .line { stroke: #E8E8EC; stroke-width: 1; }
    .icon { fill: none; stroke: #0A0A0D; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <g id="Screen-Analytics">
    <rect id="Background" width="400" height="880" rx="36" fill="#FFFFFF"/>

    <g id="Status-Bar">
      <text class="ui" x="24" y="31" font-size="14" font-weight="700">9:41</text>
    </g>

    <g id="Header">
      <text class="ui" x="24" y="82" font-size="30" font-weight="700" letter-spacing="-0.8">Analytics</text>
      <g id="Share-Button" transform="translate(355 62)">
        <path class="icon" d="M0 4v16h18V4M9 13V-7M3-1l6-6 6 6"/>
        <rect x="-13" y="-12" width="44" height="44" fill="transparent"/>
      </g>
    </g>

    <g id="Period-Control">
      <rect x="132" y="104" width="136" height="42" rx="21" fill="#FFFFFF" stroke="#0A0A0D" stroke-width="1.5"/>
      <text class="ui" x="188" y="130" text-anchor="middle" font-size="16">This month</text>
      <path class="icon" d="M240 121l6 6 6-6"/>
    </g>

    <g id="Metric-Segmented-Control">
      <rect x="64" y="164" width="272" height="48" rx="24" fill="#F3F3F5"/>
      <rect x="64" y="164" width="136" height="48" rx="24" fill="#0A0A0D"/>
      <text class="ui" x="132" y="194" text-anchor="middle" font-size="15" font-weight="500" fill="#FFFFFF" style="fill:#FFFFFF">Expenses</text>
      <text class="ui" x="268" y="194" text-anchor="middle" font-size="15" font-weight="500">Income</text>
    </g>

    <g id="Total-Metric">
      <text class="rounded" x="200" y="276" text-anchor="middle" font-size="52" font-weight="700" letter-spacing="-1.2">₹31,750</text>
      <text class="ui secondary" x="200" y="301" text-anchor="middle" font-size="15">total spent</text>
    </g>

    <g id="Spending-Trend-Chart">
      <g id="Chart-Grid">
        <line class="line" x1="50" y1="330" x2="376" y2="330"/>
        <line class="line" x1="50" y1="373" x2="376" y2="373"/>
        <line class="line" x1="50" y1="416" x2="376" y2="416"/>
        <line class="line" x1="50" y1="459" x2="376" y2="459"/>
        <line x1="142" y1="326" x2="142" y2="459" stroke="#D8D8DE" stroke-width="1" stroke-dasharray="3 4"/>
        <line x1="250" y1="326" x2="250" y2="459" stroke="#D8D8DE" stroke-width="1" stroke-dasharray="3 4"/>
        <line x1="354" y1="326" x2="354" y2="459" stroke="#D8D8DE" stroke-width="1" stroke-dasharray="3 4"/>
      </g>
      <g id="Chart-Axis-Labels">
        <text class="ui secondary" x="43" y="334" text-anchor="end" font-size="12">12K</text>
        <text class="ui secondary" x="43" y="377" text-anchor="end" font-size="12">8K</text>
        <text class="ui secondary" x="43" y="420" text-anchor="end" font-size="12">4K</text>
        <text class="ui secondary" x="43" y="463" text-anchor="end" font-size="12">0</text>
        <text class="ui secondary" x="58" y="490" text-anchor="middle" font-size="12">Week 1</text>
        <text class="ui secondary" x="155" y="490" text-anchor="middle" font-size="12">Week 2</text>
        <text class="ui secondary" x="260" y="490" text-anchor="middle" font-size="12">Week 3</text>
        <text class="ui secondary" x="354" y="490" text-anchor="middle" font-size="12">Week 4</text>
      </g>
      <path id="Expense-Trend" d="M50 414 C88 407 109 349 142 349 C180 349 202 414 246 414 C290 414 317 363 353 363 C363 363 370 366 376 370" fill="none" stroke="#0A0A0D" stroke-width="3" stroke-linecap="round"/>
      <circle id="Selected-Point" cx="142" cy="349" r="7" fill="#FFFFFF" stroke="#0A0A0D" stroke-width="3"/>
    </g>

    <g id="Category-Breakdown" data-layout="vertical">
      <g id="Category-Header">
        <text class="ui" x="24" y="542" font-size="23" font-weight="700">By category</text>
        <text class="ui secondary" x="346" y="540" text-anchor="end" font-size="14">See all</text>
        <path d="M363 532l7 7-7 7" fill="none" stroke="#85858F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g id="Category-Row-Food" data-row-height="62" data-min-hit-area="44">
        <text x="24" y="594" font-family="Apple Color Emoji" font-size="31">🍽️</text>
        <text class="ui" x="82" y="582" font-size="17" font-weight="600">Food</text>
        <text class="rounded" x="376" y="582" text-anchor="end" font-size="17" font-weight="600">₹8,450</text>
        <rect x="82" y="600" width="294" height="6" rx="3" fill="#EEEEF1"/>
        <rect x="82" y="600" width="198" height="6" rx="3" fill="#0A0A0D"/>
        <line class="line" x1="24" y1="620" x2="376" y2="620"/>
      </g>

      <g id="Category-Row-Shopping" data-row-height="62" data-min-hit-area="44">
        <text x="24" y="656" font-family="Apple Color Emoji" font-size="31">🛍️</text>
        <text class="ui" x="82" y="644" font-size="17" font-weight="600">Shopping</text>
        <text class="rounded" x="376" y="644" text-anchor="end" font-size="17" font-weight="600">₹7,800</text>
        <rect x="82" y="662" width="294" height="6" rx="3" fill="#EEEEF1"/>
        <rect x="82" y="662" width="170" height="6" rx="3" fill="#0A0A0D"/>
        <line class="line" x1="24" y1="682" x2="376" y2="682"/>
      </g>

      <g id="Category-Row-Transport" data-row-height="62" data-min-hit-area="44">
        <text x="24" y="718" font-family="Apple Color Emoji" font-size="31">🚕</text>
        <text class="ui" x="82" y="706" font-size="17" font-weight="600">Transport</text>
        <text class="rounded" x="376" y="706" text-anchor="end" font-size="17" font-weight="600">₹4,320</text>
        <rect x="82" y="724" width="294" height="6" rx="3" fill="#EEEEF1"/>
        <rect x="82" y="724" width="122" height="6" rx="3" fill="#0A0A0D"/>
      </g>
    </g>

    <g id="Navigation-Bottom-Bar">
      <line class="line" x1="0" y1="768" x2="400" y2="768"/>

      <g id="Nav-Transactions" transform="translate(43 812)">
        <path class="icon" d="M-10-14h20v28l-4-3-4 3-4-3-4 3-4-3zM-5-7h10M-5-1h10M-5 5h7"/>
        <rect x="-22" y="-22" width="44" height="44" fill="transparent"/>
      </g>

      <g id="Nav-Wallet" transform="translate(122 812)">
        <path class="icon" d="M-10-8h18a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4h-18a4 4 0 0 1-4-4V-4a4 4 0 0 1 4-4zM-8-8v-3a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3"/>
        <rect x="-22" y="-22" width="44" height="44" fill="transparent"/>
      </g>

      <g id="Nav-Add" transform="translate(200 812)">
        <circle cx="0" cy="0" r="23" fill="#0A0A0D"/>
        <path d="M-10 0h20M0-10v20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="-24" y="-24" width="48" height="48" fill="transparent"/>
      </g>

      <g id="Nav-Analytics-Active" transform="translate(278 812)">
        <rect x="-13" y="2" width="5" height="12" rx="2" fill="#0A0A0D"/>
        <rect x="-3" y="-9" width="5" height="23" rx="2" fill="#0A0A0D"/>
        <rect x="7" y="-3" width="5" height="17" rx="2" fill="#0A0A0D"/>
        <rect x="-22" y="-22" width="44" height="44" fill="transparent"/>
      </g>

      <g id="Nav-Settings" transform="translate(357 812)">
        <circle class="icon" cx="0" cy="0" r="6"/>
        <circle class="icon" cx="0" cy="0" r="13"/>
        <path class="icon" d="M0-19v6M0 13v6M-19 0h6M13 0h6M-13.5-13.5l4.3 4.3M9.2 9.2l4.3 4.3M13.5-13.5l-4.3 4.3M-9.2 9.2l-4.3 4.3"/>
        <rect x="-22" y="-22" width="44" height="44" fill="transparent"/>
      </g>

      <rect id="Home-Indicator" x="140" y="859" width="120" height="5" rx="2.5" fill="#0A0A0D"/>
    </g>
  </g>
</svg>
